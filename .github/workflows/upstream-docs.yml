name: upstream docs

# Kodi's AGENTS.md is normative for anything we contribute upstream, and the team
# have said they intend to expand it. Nothing notifies us when it changes, so poll
# for it and raise an issue — the skills that summarise its scope go stale the
# moment it moves.
#
# Note: GitHub disables scheduled workflows on a repository with no activity for
# 60 days. If this stops firing, that is why; a push re-enables it.
on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour: scheduled jobs on the hour are heavily
    # contended and get delayed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: upstream documents unchanged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for drift
        id: check
        env:
          # Anonymous API calls are rate limited to 60/hour per IP, and a shared
          # runner IP burns that quickly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/sync-upstream-docs.py --check > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Raise or update an issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Upstream agent docs have changed"
          # One issue, reopened by comment, rather than a new one every Monday.
          existing=$(gh issue list --state open --label upstream-drift \
                       --json number --jq '.[0].number // empty')
          {
            echo "\`scripts/sync-upstream-docs.py --check\` reports drift."
            echo
            echo "Refresh the snapshot, then **re-read the skills that cite the document** — the snapshot is the easy half, and a skill summarising the old scope is now wrong."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > body.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh label create upstream-drift --description "An upstream document we mirror has changed" --color BFD4F2 2>/dev/null || true
            gh issue create --title "$title" --label upstream-drift --body-file body.md
          fi
