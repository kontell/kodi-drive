name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: skill schema and confidence bar
    runs-on: ubuntu-24.04
    steps:
      # Full history: the overlap step below diffs against the PR base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skills
        run: python3 scripts/validate.py

      # The catalogue is generated, so a skill added without regenerating it
      # would leave the two disagreeing.
      - name: Catalogue is up to date
        run: python3 scripts/build-index.py --check

      # Duplication is invisible to every other check — two skills half-covering
      # one topic both validate and both scrub clean.
      #
      # Informational by design. A high score is a question ("is this duplication
      # or a cross-reference?"), and a check that fails on a question teaches
      # contributors to route around it. The table goes to the job summary, which
      # is visible on the PR without needing write permission, and so works for
      # pull requests from forks.
      - name: Overlap with existing skills
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          mapfile -t changed < <(
            git diff --name-only --diff-filter=d "$base...HEAD" -- '*/SKILL.md'
          )
          if [ ${#changed[@]} -eq 0 ]; then
            echo "No skills changed in this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'checking overlap for: %s\n' "${changed[@]}"
          python3 scripts/overlap.py --against "${changed[@]}" --markdown --top 10 \
            >> "$GITHUB_STEP_SUMMARY"

  privacy:
    name: privacy scan
    runs-on: ubuntu-24.04
    steps:
      # gitleaks needs history to scan commits, not just the working tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for hostnames, addresses, and credentials
        run: python3 scripts/scrub.py --detect

      # An independent second pass. scrub.py knows this project's shapes;
      # gitleaks knows the wider catalogue of credential formats. Neither is
      # a superset of the other, so both run.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  plugin:
    name: plugin manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: Declared skill directories exist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          missing = [d for d in manifest.get("skills", [])
                     if not pathlib.Path(d).is_dir()]
          if missing:
              sys.exit(f"plugin.json declares missing directories: {missing}")
          print("skill directories OK")
          PY

  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # bin/ lands on the PATH of every agent that installs this plugin, so a
      # quoting bug here becomes a quoting bug in somebody else's session.
      #
      # Select by shebang rather than by path: bin/ holds Python helpers too, and
      # shellcheck errors out (SC1071) rather than skipping a file it cannot parse.
      - name: Check shell scripts
        run: |
          mapfile -t files < <(
            {
              # executables, by shebang
              grep -rlE '^#!.*/(env +)?(bash|sh|dash|ksh)\b' bin scripts lib 2>/dev/null || true
              # sourced libraries have no shebang; they declare their shell instead
              grep -rlE '^# shellcheck shell=' bin scripts lib 2>/dev/null || true
            } | sort -u
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found"
            exit 0
          fi
          printf 'checking: %s\n' "${files[@]}"
          shellcheck -S warning "${files[@]}"
